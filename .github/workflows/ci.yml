name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      SESSION_SECRET: test-session-secret-for-ci
      ALLOWED_GOOGLE_EMAIL: ${{ secrets.ALLOWED_GOOGLE_EMAIL }}
      NODE_ENV: development
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3001/auth/google/callback
      ANTHROPIC_API_KEY: test-anthropic-key-placeholder
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGIN: http://localhost:5173
      PUBLIC_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Build server (check-migrations + tsc)
        run: npm run build
        working-directory: server

      - name: Run integration tests
        run: npm test
        working-directory: server

  build-client:
    name: Client TypeScript check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: client
